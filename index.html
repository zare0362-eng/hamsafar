<!DOCTYPE html>
<html lang="fa" dir="rtl">


</style>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>همسفر مشهد</title>
    <style>
  body {
    margin: 0;
    font-family: Tahoma, sans-serif;
    direction: rtl;
    background-color: #f3f6fa;
    color: #243447;
  }

  header {
    background-color: #064e78;
    color: white;
    text-align: center;
    padding: 25px 15px;
  }

  header h1 {
    margin: 0;
    font-size: 28px;
  }

  header p {
    margin-bottom: 0;
  }

  .container {
    max-width: 900px;
    margin: 30px auto;
    padding: 20px;
  }

  .welcome {
    background: white;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 3px 12px #00000012;
  }
</head>

<body>
        
<header>
  <h1>همسفر مشهد</h1>
  <p>همراه شما در سفری خاطره‌انگیز به مشهد مقدس</p>
</header>
        
<main class="container">
  <section class="welcome">
    <h2>به سامانه همسفر مشهد خوش آمدید</h2>

    <p>
      با همسفر، سفر گروهی به مشهد را
      آسان‌تر، منظم‌تر و لذت‌بخش‌تر تجربه کنید.
    </p>

    <p>
      امکان ثبت‌نام مسافران، انتخاب صندلی اتوبوس
      و رزرو اتاق هتل در یک سامانه.
    </p>
  </section>
</main>



    <h1>همسفر مشهد</h1>

    <p>به سامانه مدیریت سفرهای گروهی خوش آمدید.</p>

    <h2>ورود مسافر</h2>

    <form>
        <label for="mobile">شماره همراه:</label>

        <input
            type="tel"
            id="mobile"
            placeholder="شماره موبایل خود را وارد کنید"
        >

        <button type="submit">ورود به سامانه</button>
    </form>

</body>
</html>
